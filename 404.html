<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0c">
  <meta name="robots" content="noindex, nofollow">
  <title>QBZ — Maintenance</title>
  <script src="https://analytics.ahrefs.com/analytics.js" data-key="GatAOIz1UEaXwF70iUEMVg" async></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090a0c;
      color: #f4f4f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 36%, rgba(200, 205, 214, .09), transparent 32rem),
        linear-gradient(145deg, #111318 0%, #090a0c 58%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .11;
      background-image: repeating-linear-gradient(90deg, transparent 0 5rem, rgba(255,255,255,.035) 5rem calc(5rem + 1px));
    }

    main {
      width: min(42rem, calc(100% - 3rem));
      padding: clamp(2rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 1.25rem;
      background: rgba(13, 15, 18, .78);
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin: 0 0 3.5rem;
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 750;
      letter-spacing: .28em;
      text-indent: .28em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin-bottom: 1.4rem;
      color: #b9bdc6;
      font: 600 .72rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: #d2a85b;
      box-shadow: 0 0 1rem rgba(210, 168, 91, .65);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.85rem, 6vw, 3.35rem);
      line-height: 1.06;
      letter-spacing: -.045em;
    }

    .en, .es {
      margin: 1.2rem auto 0;
      max-width: 31rem;
      font-size: clamp(1rem, 2.8vw, 1.12rem);
      line-height: 1.65;
    }

    .en { color: #d2d4d8; }
    .es { color: #969ba5; }

    footer {
      margin-top: 3.4rem;
      color: #696e78;
      font: 500 .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="QBZ">QBZ</div>
    <div class="status">Maintenance · Mantenimiento</div>
    <h1>We’ll be back shortly.</h1>
    <p class="en">We’re making a few adjustments to the site. Thank you for your patience.</p>
    <p class="es" lang="es">Estamos haciendo algunos ajustes al sitio. Volvemos pronto; gracias por tu paciencia.</p>
    <footer>Native hi-fi · Bit-perfect audio</footer>
  </main>
</body>
</html>
